<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raid Mitigation Planner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="top">
  <div class="brand"><h1>Raid Mitigation Planner</h1><span class="fightname" id="fightname"></span></div>
  <div class="controls">
    <select class="btn" id="fightSel" aria-label="Fight"></select>
    <select class="btn" id="sortSel" aria-label="Sort fights"><option value="opened">Last opened</option><option value="name">Name A–Z</option><option value="zone">By zone</option><option value="imported">Newest import</option></select>
    <button class="btn" id="importBtn">Import fight</button>
    <button class="btn" id="partyBtn">Party</button>
    <select class="btn" id="jobSel" aria-label="Show mitigations for" hidden></select>
    <button class="btn" id="fillBtn">Fill from logs</button>
    <button class="btn" id="autoBtn">Suggest all</button>
    <button class="btn" id="clearBtn">Clear</button>
    <button class="btn" id="planTxtBtn">Export plan</button>
    <button class="btn primary" id="sheetBtn">Cheat sheet</button>
  </div>
</div>
<div id="banner"></div>
<div class="bosses" id="bosses" role="group" aria-label="Boss"></div>
<div class="summary" id="summary"></div>
<div class="overview" id="overview"></div>
<div id="sheetView" hidden></div>
<div class="main" id="mainView">
  <div class="list" id="list"></div>
  <aside class="palette" id="palette" aria-label="Mitigations"></aside>
</div>
<button class="btn primary fab" id="fab">Mitigations</button>

<script src="js/platform/storage.js"></script>
<script src="js/platform/downloads.js"></script>
<script src="js/platform/index.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
